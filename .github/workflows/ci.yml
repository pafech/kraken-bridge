name: CI

# Triggers on pushes to main and on PRs targeting main. A feature branch gets
# its CI run through the PR; running it on the push as well built every PR
# twice. Tag pushes go to release.yml (which produces the canonical Play Store
# build); this CI workflow produces a release-capable signed APK + AAB on every
# main commit so any green build can be promoted to the Play Store without an
# extra rebuild.
#
# release.yml also calls this workflow (workflow_call) and makes its release
# job wait for it, so a tag on a commit whose pipeline is red never publishes.
# In that call github.run_number is the release run's counter, so a ci-<sha>
# build there would carry a low versionCode that Play rejects. Its APK and
# AAB are therefore not uploaded (github.workflow is the caller's name,
# "Release"); the release job publishes the only shippable artifacts.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 0a: Android Lint ──────────────────────────────────────────────────
  # Hard gate: warningsAsErrors is set in app/build.gradle.kts, so any new
  # lint warning fails this job. Deliberately deferred checks are disabled
  # with a reasoned comment in that lint block — never silently.
  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

  # ── Job 0: JVM unit tests ─────────────────────────────────────────────────
  # Pure-logic tests (ReconnectBackoff, ButtonDebouncer, KrakenServiceState
  # transitions, Camera setup chain, payload parsing) — seconds, no emulator. Runs in parallel
  # with the build; a red here fails the run and blocks promotion like any
  # other job.
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  # ── Job 1: Build signed release APK + AAB ─────────────────────────────────
  # Produces the same artifact shape as release.yml but with a non-shipping
  # version name (ci-<shortsha>) so it can never be confused with a tagged
  # release. VERSION_CODE uses ci.yml's github.run_number directly — this
  # counter is per-workflow, NOT shared with release.yml. release.yml adds
  # a +100 offset to keep tagged releases above the CI range (CI artifacts
  # are for sideload/QA, releases ship to Play Store).
  # Dependabot PRs are the one exception: they run without repository
  # secrets, so their release build is unsigned and uploads no artifact.
  build:
    name: Build signed release APK + AAB
    runs-on: ubuntu-latest
    env:
      # A step-level `if` cannot read the secrets context, so the presence
      # of the keystore secret is mirrored here.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "VERSION_NAME=ci-$SHORT_SHA" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Decode keystore
        # Dependabot PRs run without repository secrets. Without a keystore
        # the release build stays unsigned (build.gradle.kts attaches the
        # signing config only when KEYSTORE_PATH is set), which still proves
        # the R8 build. The push to main after the merge signs as usual.
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        # An unsigned build (no keystore) is not shippable, so it is not
        # offered; neither is the build of the release gate (see the header).
        if: env.KEYSTORE_PATH != '' && github.workflow == 'CI'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kraken-bridge-${{ env.VERSION_NAME }}-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: Upload release AAB
        if: env.KEYSTORE_PATH != '' && github.workflow == 'CI'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kraken-bridge-${{ env.VERSION_NAME }}-playstore-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 3

  # ── Job 2: BDD instrumented tests on Android emulator ─────────────────────
  #
  # Runs all Cucumber scenarios except those tagged @device-only or @manual.
  # @device-only scenarios need real-device state (Bluetooth toggles, one-shot
  # permission dialogs, seeded video media) and are excluded here.
  #
  # Uses a debug build because R8 minification (enabled in release) would
  # break instrumentation test discovery and accessibility-tree assertions.
  # The release artifact correctness is covered by Job 1 (assembleRelease).
  bdd-tests:
    name: BDD instrumented tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM for hardware acceleration
        # Required for x86_64 emulator on Linux GitHub Actions runners
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run BDD tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The script lives in its own file because android-emulator-runner may
          # execute each line as a separate shell invocation, breaking multi-line
          # constructs (if/fi, variable capture, line continuations).
          script: bash .github/scripts/run-bdd-tests.sh

      # bdd-reports/ is written host-side by run-bdd-tests.sh (the tee'd
      # `am instrument` output, one line per scenario). Don't try to
      # `adb pull` anything here: android-emulator-runner shuts the
      # emulator down when its script step ends, so the device is gone
      # by the time any later step runs.
      - name: Upload BDD test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-test-results-${{ github.sha }}
          path: bdd-reports/
          retention-days: 14
